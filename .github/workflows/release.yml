name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run python scripts/build.py verify --tag ${{ github.ref_name }}
      - name: Verify manual build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv run python scripts/build.py verify

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            artifact: dist/*linux-x86_64.AppImage
          - os: windows-latest
            target: windows
            artifact: dist/*windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: uv run python scripts/build.py build --target ${{ matrix.target }}
      - run: uv run python scripts/build.py smoke --target ${{ matrix.target }}
      - run: uv run python scripts/build.py checksums --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
